name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: bash -n install.sh
      - run: npm run typecheck
      - run: npm test
      - run: git diff --exit-code -- lib
      - run: npm audit --audit-level=high
      - run: npm run pack:verify

  dsh-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # pnpm 12 needs its install script to replace its bootstrap shim with the
      # native executable used by DSH's direct process spawn.
      - run: npm install --prefix "$RUNNER_TEMP/frontgate-pnpm" --no-audit --no-fund pnpm@12.16.1
      - run: echo "$RUNNER_TEMP/frontgate-pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm install --prefix "$RUNNER_TEMP/frontgate-dsh" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.2
      - run: npm run test:dsh
        env:
          DSH_TEST_INSTALL_DIR: ${{ runner.temp }}/frontgate-dsh
